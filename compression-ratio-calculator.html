<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Compression Ratio Calculator</title>
<style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
    h2 { margin-bottom: 10px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
    label { display: flex; flex-direction: column; font-size: 0.9rem; }
    input { padding: 4px; font-size: 0.9rem; }
    button { margin-top: 12px; padding: 6px 12px; font-size: 0.9rem; }
    .full-width { grid-column: 1 / 3; }

    #results {
      display: inline-grid;
      grid-template-columns: auto auto;
      column-gap: 24px;
      row-gap: 4px;
    }

    #results .result-row {
      display: contents;
    }

    #results .result-label {
      font-weight: 600;
    }

    #results .result-value {
      text-align: right;
    }

    #presets {
      margin-bottom: 20px;
    }

    #presets button {
      margin-right: 10px;
      padding: 6px 12px;
      font-size: 0.9rem;
    }
</style>
</head>
<body>

<h2>Compression Ratio Calculator</h2>

<div style="padding-left: 40px; padding-right: 40px;">

<!-- LS PRESET BUTTONS -->
<div id="presets">
  <button onclick="loadPreset('LS1')">LS1</button>
  <button onclick="loadPreset('LS3')">LS3</button>
  <button onclick="loadPreset('LS7')">LS7</button>
  <button onclick="loadPreset('LSX454')">My 454</button>
<p>(I'm not certain that the LSx presets are correct. <br> Please open a pull request if you find errors.)

</div>


<p>

<form id="crForm" margin=5>
    <label>Cylinders
        <input name="cyl" type="number" value="8">
    </label>

    <label>Chamber Volume (cc)
        <input name="chamber" type="number" step="0.1" value="69">
    </label>

    <label>Bore (inches)
        <input name="bore" type="number" step="0.001" value="4.185">
    </label>

    <label>Stroke (inches)
        <input name="stroke" type="number" step="0.001" value="4.125">
    </label>

    <label>Gasket Bore (inches)
        <input name="gbore" type="number" step="0.001" value="4.200">
    </label>

    <label>Compressed Gasket Thickness (inches)
        <input name="gthick" type="number" step="0.001" value="0.051">
    </label>

    <label>Piston Crown Diameter (inches)
        <input name="topland" type="number" step="0.001" value="4.147">
    </label>

    <label>Piston Crown Height (inches)
        <input name="ringdown" type="number" step="0.001" value="0.290">
    </label>

    <label>Rod Length (inches)
        <input name="rod" type="number" step="0.001" value="6.125">
    </label>

    <label>Block Deck Height (inches)
        <input name="deck" type="number" step="0.001" value="9.245">
    </label>

    <label>Dome (-) or Dish (+) Volume (cc)
        <input name="dome" type="number" step="0.1" value="3">
    </label>

    <label>Piston to Deck (inches)
        <input name="p2d" type="number" step="0.001" value="0.005">
    </label>

    <br>The dome/dish number above will be added to the combustion chamber volume, so if you have dome, use a negative number.
    <button type="button" class="full-width" onclick="calcCR()">Calculate</button>
</form>

<div id="results" class="result"></div>

</div>

<script>
function ccFromCylinder(diameter, height) {
    const radius = diameter / 2;
    const area = Math.PI * radius * radius;
    const volumeIn3 = area * height;
    return volumeIn3 * 16.387064;
}

function loadPreset(preset) {
    const presets = {
        LS1:  { bore: 3.898, stroke: 3.622, rod: 6.098, deck: 9.240, gbore: 3.910, gthick: 0.051, chamber: 67, dome: 0, topland: 3.870, ringdown: 0.280, p2d: 0.005 },
        LS3:  { bore: 4.065, stroke: 3.622, rod: 6.098, deck: 9.240, gbore: 4.100, gthick: 0.051, chamber: 68, dome: 0, topland: 4.035, ringdown: 0.280, p2d: 0.005 },
        LS7:  { bore: 4.125, stroke: 4.000, rod: 6.067, deck: 9.240, gbore: 4.150, gthick: 0.051, chamber: 70, dome: 0, topland: 4.095, ringdown: 0.280, p2d: 0.005 },
        LSX454:{ bore: 4.185, stroke: 4.125, rod: 6.125, deck: 9.245, gbore: 4.200, gthick: 0.051, chamber: 69, dome: 3, topland: 4.147, ringdown: 0.290, p2d: 0.005 }
    };

    const x = presets[preset];
    const f = document.getElementById("crForm");

    f.bore.value     = x.bore;
    f.stroke.value   = x.stroke;
    f.rod.value      = x.rod;
    f.deck.value     = x.deck;
    f.gbore.value    = x.gbore;
    f.gthick.value   = x.gthick;
    f.chamber.value  = x.chamber;
    f.dome.value     = x.dome;
    f.topland.value  = x.topland;
    f.ringdown.value = x.ringdown;
    f.p2d.value      = x.p2d;
}

function calcCR() {
    const f = document.getElementById("crForm");

    const bore     = parseFloat(f.bore.value)     || 0;
    const stroke   = parseFloat(f.stroke.value)   || 0;
    const gbore    = parseFloat(f.gbore.value)    || 0;
    const gthick   = parseFloat(f.gthick.value)   || 0;
    const deck     = parseFloat(f.deck.value)     || 0;
    const rod      = parseFloat(f.rod.value)      || 0;
    const ringdown = parseFloat(f.ringdown.value) || 0;
    const topland  = parseFloat(f.topland.value)  || 0;
    const chamber  = parseFloat(f.chamber.value)  || 0;
    const dome     = parseFloat(f.dome.value)     || 0;
    const p2d      = parseFloat(f.p2d.value)      || 0;

    const sweptVol = ccFromCylinder(bore, stroke);
    const gasketVol = ccFromCylinder(gbore, gthick);
    const deckVol = ccFromCylinder(gbore, Math.max(p2d, 0));

    const topRingVol =
        ccFromCylinder(bore, ringdown) -
        ccFromCylinder(topland, ringdown);

    const combustionVol = chamber + gasketVol + deckVol + topRingVol + dome;
    const cr = (sweptVol + combustionVol) / combustionVol;

    const compHeight = deck - rod - (stroke / 2) - p2d;

    const totalDisplacementCc = sweptVol * (parseFloat(f.cyl.value) || 0);
    const totalDisplacementCi = totalDisplacementCc / 16.387064;

    const results = document.getElementById("results");
    results.innerHTML = `
      <div class="result-row"><span class="result-label">All Cylinders</span><span class="result-value"></span></div>
      <div class="result-row"><span class="result-label">Total Displacement:</span><span class="result-value">${totalDisplacementCc.toFixed(2)} cc</span></div>
      <div class="result-row"><span class="result-label">Total Displacement:</span><span class="result-value">${totalDisplacementCi.toFixed(2)} ci</span></div>
      <div class="result-row"><span class="result-label">&nbsp;</span><span class="result-value"></span></div>
      <div class="result-row"><span class="result-label">Per Cylinder</span><span class="result-value"></span></div>
      <div class="result-row"><span class="result-label">Swept Volume:</span><span class="result-value">${sweptVol.toFixed(2)} cc</span></div>
      <div class="result-row"><span class="result-label">Gasket Volume:</span><span class="result-value">${gasketVol.toFixed(2)} cc</span></div>
      <div class="result-row"><span class="result-label">Deck Volume:</span><span class="result-value">${deckVol.toFixed(2)} cc</span></div>
      <div class="result-row"><span class="result-label">Top Ring Volume:</span><span class="result-value">${topRingVol.toFixed(2)} cc</span></div>
      <div class="result-row"><span class="result-label">Combustion Volume:</span><span class="result-value">${combustionVol.toFixed(2)} cc</span></div>
      <div class="result-row"><span class="result-label">Compression Ratio:</span><span class="result-value">${cr.toFixed(2)}</span></div>
      <div class="result-row"><span class="result-label">Piston Compression Height:</span><span class="result-value">${compHeight.toFixed(4)} in</span></div>
    `;
}
</script>

</body>
</html>
